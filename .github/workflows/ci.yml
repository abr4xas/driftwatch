name: CI

on:
  push:
    # The default branch is `master`. This said `main` until the first push,
    # which is why no run exists before 2026-09-09.
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # ADR-0002: the floor is Node 24 (active LTS until 2026-10-20).
        # The upper end tracks *current*, which is 26 since 2026-05-05. Node 25
        # reached end of life on 2026-06-01 and was removed from the matrix.
        node: [24, 26]

    steps:
      - uses: actions/checkout@v7
        with:
          # driftwatch uses `git ls-files` to build its index, so it needs a
          # real working tree, not just the commit.
          fetch-depth: 1

      # v6 is the first release that supports pnpm 11, which is what
      # package.json pins in `packageManager`. Older majors do not put the
      # binary on PATH, because pnpm 11 moved it to $PNPM_HOME/bin.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # Explicit: since setup-node v6, automatic caching only kicks in for
          # npm, so naming pnpm here is what keeps the store cached.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # A broken `bin` shows up in no unit test: the compiled binary has to be
      # invoked the way a user would invoke it.
      - name: the compiled binary responds
        run: node ./dist/cli.js --help

      # The tool run against its own repo: the first real test subject, and now
      # blocking. The run is clean, so any path that breaks in a discovered
      # source takes CI down. Today that means AGENTS.md and nothing else:
      # `docs/` is not an agent context file, so discovery does not reach it.
      - name: driftwatch on driftwatch
        run: node ./dist/cli.js

      # ADR-0008: `docs/spec/` and `docs/adr/` are not agent context files, so
      # discovery does not reach them. They are audited as a second invocation
      # with their own config, and it is blocking for the same reason the first
      # one is: this repo's documentation is the tool's first test subject.
      - name: driftwatch on its own documentation
        run: node ./dist/cli.js --config driftwatch.docs.config.yaml

      # The published tarball must hold the build and nothing else. Checked
      # here as well as in the release workflow, so a `files` mistake fails on
      # the commit that makes it rather than at the tag.
      - run: pnpm pack:check

  # The action running the code of this commit, not whatever is on npm.
  #
  # `version` takes the tarball `pnpm pack` just built, which is the only way
  # this job fails on the commit that breaks the action rather than on the tag
  # that publishes it. An action nobody runs is an action that breaks silently.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `pnpm pack` prints the tarball it wrote, and whether that is a name or
      # an absolute path has changed between majors. Normalise rather than
      # assume: the action resolves the spec from the workspace root.
      - id: pack
        run: |
          tarball="$(pnpm pack | tail -1)"
          case "$tarball" in
            /*) ;;
            *) tarball="$(pwd)/$tarball" ;;
          esac
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # The repo is clean, so drift here means the audit found something real.
      - uses: ./
        id: drift
        with:
          version: ${{ steps.pack.outputs.tarball }}
          sarif: true

      - name: the outputs say what happened
        run: |
          test "${{ steps.drift.outputs.exit-code }}" = "0"
          test -s "${{ steps.drift.outputs.sarif-file }}"
          node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'))" \
            "${{ steps.drift.outputs.sarif-file }}"

      # fail-on-drift: false must not swallow a real failure, only a finding.
      - uses: ./
        with:
          version: ${{ steps.pack.outputs.tarball }}
          only: path
          fail-on-drift: false
