name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # ADR-0002: the floor is Node 24 (active LTS). 25 is current.
        node: [24, 25]

    steps:
      - uses: actions/checkout@v5
        with:
          # driftwatch uses `git ls-files` to build its index, so it needs a
          # real working tree, not just the commit.
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # A broken `bin` shows up in no unit test: the compiled binary has to be
      # invoked the way a user would invoke it.
      - name: the compiled binary responds
        run: node ./dist/cli.js --help

      # The tool run against its own repo: the first real test subject, and now
      # blocking. The run is clean, so any path that breaks in AGENTS.md or in
      # docs/ takes CI down.
      - name: driftwatch on driftwatch
        run: node ./dist/cli.js
